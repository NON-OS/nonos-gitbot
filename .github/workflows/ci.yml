name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint, format and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check gitbot tools tests
      - name: Format check
        run: ruff format --diff gitbot tools tests
      - name: Repository hygiene
        run: python tools/check_hygiene.py

  startup:
    name: Startup validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refuses to start without configuration
        run: |
          if python -m gitbot; then
            echo "expected a non-zero exit without configuration"
            exit 1
          fi
      - name: Rejects a non-numeric chat id
        run: |
          if BOT_TOKEN=123:abc CHAT_ID=not-a-number WEBHOOK_SECRET=x python -m gitbot; then
            echo "expected a non-zero exit for a bad CHAT_ID"
            exit 1
          fi

  assets:
    name: Banners present and valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every tier banner exists and is a PNG
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          needed = ["banner-commits.png", "banner-pr-opened.png", "banner-pr-merged.png",
                    "banner-pr-closed.png", "banner-release.png"]
          missing = []
          for name in needed:
              p = Path("media") / name
              if not p.is_file() or p.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  missing.append(name)
          if missing:
              print("missing or not a PNG:", ", ".join(missing))
              sys.exit(1)
          print("all banners present")
          PY
